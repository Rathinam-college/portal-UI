# ============================================================
# NGINX Gateway Configuration for insight.rathinamtechzone.com & 10.10.90.202
# Portal (/) + Food Tracker (/food) + Water Tracker (/water) + CCTV (/cctv)
# ============================================================

# HTTP Server (Port 80)
server {
    listen 80;
    server_name insight.rathinamtechzone.com 10.10.90.202 _;

    client_max_body_size 100M;

    # Short URL Redirects
    location = /food {
        return 301 /food_tracker/;
    }
    location = /food/ {
        return 301 /food_tracker/;
    }
    location = /water {
        return 301 /water_tracker/;
    }
    location = /water/ {
        return 301 /water_tracker/;
    }
    location = /cctv {
        return 301 /cctv/;
    }

    # 1. CENTRAL PORTAL (Root / and /portal/)
    location /portal/ {
        alias /home/rathinam/portal-prod/;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location = / {
        root /home/rathinam/portal-prod;
        index index.html;
        try_files /index.html =404;
    }

    location ^~ /color_themes/ {
        alias /home/rathinam/portal-prod/color_themes/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 2. FOOD TRACKER (Port 8082)
    location /food_tracker/bills/ {
        proxy_pass http://127.0.0.1:8082/food_tracker/bills/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location /food_tracker/ {
        proxy_pass http://127.0.0.1:8082/food_tracker/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. WATER TRACKER (Port 8081)
    location /water_tracker/ {
        proxy_pass http://127.0.0.1:8081/water_tracker/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4. CCTV SYSTEM (Port 8083 & API 5003)
    location /cctv/api/ {
        proxy_pass http://127.0.0.1:5003/cctv/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /cctv/admin/ {
        proxy_pass http://127.0.0.1:5003/cctv/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /cctv/static/ {
        proxy_pass http://127.0.0.1:5003/cctv/static/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /cctv/media/ {
        alias /home/rathinam/cctv-tracker-prod/media/;
        expires 30d;
        add_header Cache-Control "public";
    }

    location /cctv/ {
        proxy_pass http://127.0.0.1:8083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 5. TRANSPORT TRACKER (Port 8086 frontend & Port 8006 backend)
    location = /transport {
        return 301 /transport/;
    }

    location /transport/api/ {
        proxy_pass http://127.0.0.1:8006;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /transport/admin/ {
        proxy_pass http://127.0.0.1:8006;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /transport/static/ {
        proxy_pass http://127.0.0.1:8006;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /transport/media/ {
        alias /home/rathinam/transport-tracker-prod/media/;
        expires 30d;
        add_header Cache-Control "public";
    }

    location /transport/ {
        proxy_pass http://127.0.0.1:8086;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

