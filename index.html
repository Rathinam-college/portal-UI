<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <!-- Favicon -->
    <link rel="icon" href="./color_themes/favicon.svg" type="image/svg+xml">
    <title>RGU Portal</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --font-outfit: 'Outfit', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --bg-page: #e1e6f7;
            --mesh-1: #c3cdee;
            --mesh-2: #c6e6e4;
            --mesh-3: #d8ccf3;
            --glass-bg: rgba(255, 255, 255, 0.55);
            --glass-border: rgba(255, 255, 255, 0.85);
            --text-main: #14172c;
            --text-muted: #5d6385;
            --card-hover-bg: rgba(255, 255, 255, 0.8);
            --shadow-subtle: 0 8px 32px 0 rgba(31, 38, 135, 0.08);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-page: #0b0e1f;
                --mesh-1: #1a2046;
                --mesh-2: #14323a;
                --mesh-3: #2a1f4d;
                --glass-bg: rgba(30, 34, 64, 0.6);
                --glass-border: rgba(255, 255, 255, 0.14);
                --text-main: #f3f5ff;
                --text-muted: #9ba3cb;
                --card-hover-bg: rgba(38, 44, 82, 0.85);
                --shadow-subtle: 0 8px 32px 0 rgba(0, 0, 0, 0.35);
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-outfit);
            color: var(--text-main);
            background-color: var(--bg-page);
            background-image: 
                radial-gradient(at 0% 0%, var(--mesh-1) 0px, transparent 55%),
                radial-gradient(at 100% 40%, var(--mesh-2) 0px, transparent 50%),
                radial-gradient(at 50% 100%, var(--mesh-3) 0px, transparent 55%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Container */
        .portal-container {
            width: 100%;
            max-width: 1200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 22px;
            margin: auto;
        }

        /* Frosted Glass Base */
        .glass-panel {
            background: var(--glass-bg);
            border: 1.5px solid var(--glass-border);
            backdrop-filter: blur(24px) saturate(1.3);
            -webkit-backdrop-filter: blur(24px) saturate(1.3);
            box-shadow: var(--shadow-subtle);
        }

        /* -------------------------------------- */
        /* TOP LOGO BANNER                        */
        /* -------------------------------------- */
        .top-logo-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.92);
            border: 1.5px solid rgba(255, 255, 255, 0.95);
            border-radius: 18px;
            padding: 8px 24px;
            box-shadow: 0 10px 30px rgba(31, 38, 135, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .top-logo-badge:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 36px rgba(31, 38, 135, 0.15);
        }

        .top-logo-img {
            height: 44px;
            width: auto;
            max-width: 100%;
            object-fit: contain;
            display: block;
        }

        /* -------------------------------------- */
        /* HEADING & SUBTITLE                     */
        /* -------------------------------------- */
        .portal-header {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .portal-title {
            font-size: clamp(30px, 4.2vw, 46px);
            font-weight: 800;
            letter-spacing: -0.03em;
            line-height: 1.1;
            background: linear-gradient(135deg, #7b3f98 0%, #1e90d6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .portal-subtitle {
            font-size: 15px;
            line-height: 1.5;
            color: var(--text-muted);
            max-width: 580px;
        }

        /* -------------------------------------- */
        /* 8-BOX GRID LAYOUT                      */
        /* -------------------------------------- */
        .modules-grid {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
        }

        /* Individual Module Box Card */
        .module-box {
            border-radius: 24px;
            padding: 22px 20px;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            outline: none;
            transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1), 
                        box-shadow 0.28s ease, 
                        border-color 0.28s ease, 
                        background 0.28s ease;
        }

        .module-box:hover {
            transform: translateY(-6px);
            background: var(--card-hover-bg);
            border-color: var(--box-color);
            box-shadow: 0 18px 40px -12px var(--box-color-shadow);
        }

        .module-box:focus-visible {
            box-shadow: 0 0 0 3px var(--box-color);
        }

        /* Box Header (Index badge + Arrow) */
        .box-top-row {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
        }

        .box-index {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.12em;
            font-variant-numeric: tabular-nums;
            background: rgba(255, 255, 255, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.7);
            padding: 3px 8px;
            border-radius: 8px;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .module-box:hover .box-index {
            background: var(--box-color);
            color: #ffffff;
            border-color: var(--box-color);
        }

        .box-arrow-icon {
            width: 18px;
            height: 18px;
            color: var(--text-muted);
            opacity: 0.5;
            transform: translateX(-3px);
            transition: opacity 0.2s ease, transform 0.2s ease, color 0.2s ease;
        }

        .module-box:hover .box-arrow-icon {
            opacity: 1;
            transform: translateX(0);
            color: var(--box-color);
        }

        /* Icon Tile (52px, radius 16px) */
        .box-icon-tile {
            width: 52px;
            height: 52px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 14px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: transform 0.25s ease;
        }

        .box-icon-tile svg {
            width: 28px;
            height: 28px;
            stroke-width: 1.9;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
        }

        .module-box:hover .box-icon-tile {
            transform: scale(1.08);
        }

        /* Title & Description */
        .box-title {
            font-size: 19px;
            font-weight: 700;
            letter-spacing: -0.02em;
            line-height: 1.25;
            color: var(--text-main);
            margin-bottom: 6px;
        }

        .box-desc {
            font-size: 13.5px;
            line-height: 1.45;
            color: var(--text-muted);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Watermark in corner */
        .box-watermark {
            position: absolute;
            right: -10px;
            bottom: -10px;
            width: 90px;
            height: 90px;
            pointer-events: none;
            opacity: 0.08;
            transition: opacity 0.25s ease, transform 0.25s ease;
        }

        .box-watermark svg {
            width: 100%;
            height: 100%;
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
        }

        .module-box:hover .box-watermark {
            opacity: 0.16;
            transform: scale(1.1) rotate(4deg);
        }

        /* -------------------------------------- */
        /* FOOTER                                 */
        /* -------------------------------------- */
        .portal-footer {
            text-align: center;
            font-size: 12.5px;
            color: var(--text-muted);
            letter-spacing: 0.02em;
            padding-top: 4px;
        }

        /* -------------------------------------- */
        /* RESPONSIVE BREAKPOINTS                 */
        /* -------------------------------------- */
        @media (max-width: 1024px) {
            .modules-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 640px) {
            body {
                padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)) 16px;
            }

            .portal-container {
                gap: 16px;
            }

            .top-logo-badge {
                padding: 6px 16px;
                border-radius: 14px;
            }

            .top-logo-img {
                height: 34px;
            }

            .modules-grid {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .module-box {
                padding: 18px 16px;
                border-radius: 20px;
            }

            .box-icon-tile {
                width: 46px;
                height: 46px;
                border-radius: 14px;
                margin-bottom: 10px;
            }

            .box-icon-tile svg {
                width: 24px;
                height: 24px;
            }

            .box-title {
                font-size: 17px;
            }
        }

        /* ACCESSIBILITY: Reduced Motion */
        @media (prefers-reduced-motion: reduce) {
            *, ::before, ::after {
                animation-duration: 0.001ms !important;
                transition-duration: 0.001ms !important;
            }

            .module-box:hover {
                transform: none !important;
            }
        }
    </style>
</head>

<body>
    <main class="portal-container" role="main">
        <!-- Prominent Official Logo Banner at Top -->
        <header class="top-logo-badge" role="banner">
            <img src="./color_themes/rgu_header_logo.png" alt="Rathinam RGU Global University - NAAC A++ Accredited - 1st in Tamil Nadu" class="top-logo-img" />
        </header>

        <!-- Heading & Subtitle -->
        <div class="portal-header">
            <h1 class="portal-title">Central Portal</h1>
            <p class="portal-subtitle">
                Access and manage all tracking systems securely from one centralized dashboard.
            </p>
        </div>

        <!-- 8-Box Grid (Direct 1-Click Access) -->
        <section class="modules-grid" id="modules-grid" aria-label="Portal Modules">
            <!-- Dynamically populated from portalLinks -->
        </section>

        <!-- Footer -->
        <footer class="portal-footer">
            &copy; 2026 RGU Global. All rights reserved.
        </footer>
    </main>

    <!-- Portal Links Configuration -->
    <script>
        // ==========================================
        // DYNAMIC MODULES CONFIGURATION
        // Adding or modifying a module automatically updates the grid.
        // ==========================================
        const portalLinks = [
            {
                title: "Water Tracker",
                description: "Monitor water usage, sustainability metrics, and overall consumption.",
                url: "https://www.rguedu.in/water_tracker",
                color: "#1e90d6",
                tint: "rgba(30,144,214,.18)",
                iconSvg: `<path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/>`
            },
            {
                title: "Food Tracker",
                description: "Track food provisions, manage nutritional data, and minimize waste.",
                url: "https://www.rguedu.in/food_tracker/",
                color: "#f08a24",
                tint: "rgba(240,138,36,.18)",
                iconSvg: `<circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>`
            },
            {
                title: "CCTV Access",
                description: "View live camera feeds and review historical security footage.",
                url: "https://www.rguedu.in/cctv/",
                color: "#7b5cd6",
                tint: "rgba(123,92,214,.18)",
                iconSvg: `<polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>`
            },
            {
                title: "Maintenance",
                description: "Manage maintenance requests and track facility operations.",
                url: "https://www.rguedu.in/maintenance/#dashboard",
                color: "#e0485f",
                tint: "rgba(224,72,95,.18)",
                iconSvg: `<path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>`
            },
            {
                title: "Transport",
                description: "Manage transportation details and track vehicles.",
                url: "https://www.rguedu.in/transport/",
                color: "#2fa3e6",
                tint: "rgba(47,163,230,.18)",
                iconSvg: `<rect x="1" y="3" width="15" height="13" rx="1"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/>`
            },
            {
                title: "NextUp",
                description: "Track enterprise tasks, manage team workflows, and monitor progress.",
                url: "https://www.rguedu.in/nextup",
                color: "#6aa81c",
                tint: "rgba(106,168,28,.18)",
                iconSvg: `<path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/><polyline points="9 13 11 15 15 11"/>`
            },
            {
                title: "AI Bot",
                description: "Interactive AI assistant for campus intelligence, queries, and analytics.",
                url: "https://www.rguedu.in/ai-bot/",
                color: "#8b4fd8",
                tint: "rgba(139,79,216,.18)",
                iconSvg: `<rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4"/><line x1="8" y1="16" x2="8.01" y2="16"/><line x1="16" y1="16" x2="16.01" y2="16"/>`
            },
            {
                title: "Report",
                description: "View operations analytics, monthly summaries, and executive reports.",
                url: "https://rguedu.in/Report/",
                color: "#e8961a",
                tint: "rgba(232,150,26,.18)",
                iconSvg: `<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="8" y2="17"/><line x1="12" y1="11" x2="12" y2="17"/><line x1="16" y1="9" x2="16" y2="17"/>`
            }
        ];

        document.addEventListener("DOMContentLoaded", () => {
            const grid = document.getElementById("modules-grid");
            if (!grid) return;

            grid.innerHTML = portalLinks.map((mod, i) => {
                const formattedIndex = String(i + 1).padStart(2, '0');
                return `
                    <a 
                        href="${mod.url}" 
                        class="module-box glass-panel" 
                        style="
                            --box-color: ${mod.color};
                            --box-color-shadow: ${mod.color};
                            background: linear-gradient(145deg, ${mod.tint} 0%, rgba(255, 255, 255, 0.4) 100%), var(--glass-bg);
                        "
                        aria-label="${mod.title}"
                    >
                        <div class="box-top-row">
                            <span class="box-index" style="color: ${mod.color};">${formattedIndex}</span>
                            <svg class="box-arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="7" y1="17" x2="17" y2="7"></line>
                                <polyline points="7 7 17 7 17 17"></polyline>
                            </svg>
                        </div>

                        <div class="box-icon-tile glass-panel" style="background: ${mod.tint}; color: ${mod.color}; border: 1.5px solid ${mod.color}35; box-shadow: 0 6px 16px ${mod.color}25;">
                            <svg viewBox="0 0 24 24" stroke="currentColor">
                                ${mod.iconSvg}
                            </svg>
                        </div>

                        <h2 class="box-title">${mod.title}</h2>
                        <p class="box-desc">${mod.description}</p>

                        <div class="box-watermark" style="color: ${mod.color};" aria-hidden="true">
                            <svg viewBox="0 0 24 24" stroke="currentColor">
                                ${mod.iconSvg}
                            </svg>
                        </div>
                    </a>
                `;
            }).join('');
        });
    </script>
</body>

</html>
