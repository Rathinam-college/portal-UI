    <title>RGU Portal</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --font-outfit: 'Outfit', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --bg-page: #e1e6f7;
            --mesh-1: #c3cdee;
            --mesh-2: #c6e6e4;
            --mesh-3: #d8ccf3;
            --glass-bg: rgba(255, 255, 255, 0.55);
            --glass-border: rgba(255, 255, 255, 0.85);
            --text-main: #14172c;
            --text-muted: #5d6385;
            --card-hover-bg: rgba(255, 255, 255, 0.8);
            --shadow-subtle: 0 8px 32px 0 rgba(31, 38, 135, 0.08);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-page: #0b0e1f;
                --mesh-1: #1a2046;
                --mesh-2: #14323a;
                --mesh-3: #2a1f4d;
                --glass-bg: rgba(30, 34, 64, 0.6);
                --glass-border: rgba(255, 255, 255, 0.14);
                --text-main: #f3f5ff;
                --text-muted: #9ba3cb;
                --card-hover-bg: rgba(38, 44, 82, 0.85);
                --shadow-subtle: 0 8px 32px 0 rgba(0, 0, 0, 0.35);
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-outfit);
            color: var(--text-main);
            background-color: var(--bg-page);
            background-image: 
                radial-gradient(at 0% 0%, var(--mesh-1) 0px, transparent 55%),
                radial-gradient(at 100% 40%, var(--mesh-2) 0px, transparent 50%),
                radial-gradient(at 50% 100%, var(--mesh-3) 0px, transparent 55%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Container */
        .portal-container {
            width: 100%;
            max-width: 1200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 22px;
            margin: auto;
        }

        /* Frosted Glass Base */
        .glass-panel {
            background: var(--glass-bg);
            border: 1.5px solid var(--glass-border);
            backdrop-filter: blur(24px) saturate(1.3);
            -webkit-backdrop-filter: blur(24px) saturate(1.3);
            box-shadow: var(--shadow-subtle);
        }

        /* -------------------------------------- */
        /* TOP LOGO BANNER                        */
        /* -------------------------------------- */
        .top-logo-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.92);
            border: 1.5px solid rgba(255, 255, 255, 0.95);
            border-radius: 18px;
            padding: 8px 24px;
            box-shadow: 0 10px 30px rgba(31, 38, 135, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .top-logo-badge:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 36px rgba(31, 38, 135, 0.15);
        }

        .top-logo-img {
            height: 44px;
            width: auto;
            max-width: 100%;
            object-fit: contain;
            display: block;
        }

        /* -------------------------------------- */
        /* HEADING & SUBTITLE                     */
        /* -------------------------------------- */
        .portal-header {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .portal-title {
            font-size: clamp(30px, 4.2vw, 46px);
            font-weight: 800;
            letter-spacing: -0.03em;
            line-height: 1.1;
            background: linear-gradient(135deg, #7b3f98 0%, #1e90d6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .portal-subtitle {
            font-size: 15px;
            line-height: 1.5;
            color: var(--text-muted);
            max-width: 580px;
        }

        /* -------------------------------------- */
        /* 8-BOX GRID LAYOUT                      */
        /* -------------------------------------- */
        .modules-grid {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
        }

        /* Individual Module Box Card */
        .module-box {
            border-radius: 24px;
            padding: 22px 20px;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            outline: none;
            transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1), 
                        box-shadow 0.28s ease, 
                        border-color 0.28s ease, 
                        background 0.28s ease;
        }

        .module-box:hover {
            transform: translateY(-6px);
            background: var(--card-hover-bg);
            border-color: var(--box-color);
            box-shadow: 0 18px 40px -12px var(--box-color-shadow);
        }

        .module-box:focus-visible {
            box-shadow: 0 0 0 3px var(--box-color);
        }

        /* Box Header (Index badge + Arrow) */
        .box-top-row {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
        }

        .box-index {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.12em;
            font-variant-numeric: tabular-nums;
            background: rgba(255, 255, 255, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.7);
            padding: 3px 8px;
            border-radius: 8px;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .module-box:hover .box-index {
            background: var(--box-color);
            color: #ffffff;
            border-color: var(--box-color);
        }

        .box-arrow-icon {
            width: 18px;
            height: 18px;
            color: var(--text-muted);
            opacity: 0.5;
            transform: translateX(-3px);
            transition: opacity 0.2s ease, transform 0.2s ease, color 0.2s ease;
        }

        .module-box:hover .box-arrow-icon {
            opacity: 1;
            transform: translateX(0);
            color: var(--box-color);
        }

        /* Icon Tile (52px, radius 16px) */
        .box-icon-tile {
            width: 52px;
            height: 52px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 14px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: transform 0.25s ease;
        }

        .box-icon-tile svg {
            width: 28px;
            height: 28px;
            stroke-width: 1.9;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
        }

        .module-box:hover .box-icon-tile {
            transform: scale(1.08);
        }

        /* Title & Description */
        .box-title {
            font-size: 19px;
            font-weight: 700;
            letter-spacing: -0.02em;
            line-height: 1.25;
            color: var(--text-main);
            margin-bottom: 6px;
        }

        .box-desc {
            font-size: 13.5px;
            line-height: 1.45;
            color: var(--text-muted);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Watermark in corner */
        .box-watermark {
            position: absolute;
            right: -10px;
            bottom: -10px;
            width: 90px;
            height: 90px;
            pointer-events: none;
            opacity: 0.08;
            transition: opacity 0.25s ease, transform 0.25s ease;
        }

        .box-watermark svg {
            width: 100%;
            height: 100%;
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
        }

        .module-box:hover .box-watermark {
            opacity: 0.16;
            transform: scale(1.1) rotate(4deg);
        }

        /* -------------------------------------- */
        /* FOOTER                                 */
        /* -------------------------------------- */
        .portal-footer {
            text-align: center;
            font-size: 12.5px;
            color: var(--text-muted);
            letter-spacing: 0.02em;
            padding-top: 4px;
        }

        /* -------------------------------------- */
        /* RESPONSIVE BREAKPOINTS                 */
        /* -------------------------------------- */
        @media (max-width: 1024px) {
            .modules-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 640px) {
            body {
                padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)) 16px;
            }

            .portal-container {
                gap: 16px;
            }

            .top-logo-badge {
                padding: 6px 16px;
                border-radius: 14px;
            }

            .top-logo-img {
                height: 34px;
            }

            .modules-grid {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .module-box {
                padding: 18px 16px;
                border-radius: 20px;
            }

            .box-icon-tile {
                width: 46px;
                height: 46px;
                border-radius: 14px;
                margin-bottom: 10px;
            }

            .box-icon-tile svg {
                width: 24px;
                height: 24px;
            }

            .box-title {
                font-size: 17px;
            }
        }

        /* ACCESSIBILITY: Reduced Motion */
        @media (prefers-reduced-motion: reduce) {
            *, ::before, ::after {
                animation-duration: 0.001ms !important;
                transition-duration: 0.001ms !important;
            }

            .module-box:hover {
                transform: none !important;
            }
        }
    </style>
</head>
