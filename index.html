<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <!-- Favicon -->
    <link rel="icon" href="./color_themes/favicon.svg" type="image/svg+xml">
    <title>RGU Portal</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-page: #0a0c16;
            --text-main: #f2f4ff;
            --text-muted: #8b92b4;
            --border-subtle: rgba(255, 255, 255, 0.09);
            --font-outfit: 'Outfit', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --active-color: #1e90d6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: var(--font-outfit);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Two columns on desktop: minmax(380px, 460px) 1fr, min-height 100vh */
        .launcher-shell {
            display: grid;
            grid-template-columns: minmax(380px, 460px) 1fr;
            min-height: 100vh;
            width: 100%;
            background-color: var(--bg-page);
        }

        /* -------------------------------------- */
        /* LEFT PANEL                             */
        /* -------------------------------------- */
        .left-panel {
            padding: 36px 32px;
            border-right: 1px solid var(--border-subtle);
            display: flex;
            flex-direction: column;
            gap: 20px;
            background: #0a0c16;
            position: relative;
            z-index: 10;
            height: 100vh;
            overflow-y: auto;
        }

        .left-panel::-webkit-scrollbar {
            width: 4px;
        }

        .left-panel::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }

        /* 1. Brand row */
        .brand-row {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .rgu-wordmark {
            font-size: 44px;
            font-weight: 800;
            line-height: 1;
            letter-spacing: -0.04em;
            display: flex;
            align-items: baseline;
            user-select: none;
        }

        .rgu-wordmark .char-r { color: #b66fd6; }
        .rgu-wordmark .char-g { color: #37a9f0; }
        .rgu-wordmark .char-u { color: #b5d94a; }

        .brand-divider {
            width: 2px;
            height: 38px;
            background: rgba(255, 255, 255, 0.18);
            border-radius: 1px;
            flex-shrink: 0;
        }

        .brand-subtext {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.14em;
            line-height: 1.35;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        /* 2 & 3. Heading & Subtitle */
        .portal-header-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .portal-heading {
            font-size: 34px;
            font-weight: 800;
            letter-spacing: -0.02em;
            line-height: 1.15;
            color: var(--text-main);
        }

        .portal-heading .gradient-text {
            background: linear-gradient(135deg, #b66fd6 0%, #37a9f0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .portal-subtitle {
            font-size: 14px;
            line-height: 1.5;
            color: var(--text-muted);
        }

        /* 4. Search input */
        .search-container {
            position: relative;
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            color: var(--text-muted);
            pointer-events: none;
        }

        .search-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding: 12px 42px 12px 42px;
            color: var(--text-main);
            font-family: var(--font-outfit);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
        }

        .search-input:focus {
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(255, 255, 255, 0.25);
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.08);
        }

        .search-input::placeholder {
            color: rgba(139, 146, 180, 0.65);
        }

        .search-shortcut-hint {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 6px;
            padding: 2px 7px;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            pointer-events: none;
            font-family: monospace;
        }

        /* 5. Module list */
        .module-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            list-style: none;
            flex-grow: 1;
        }

        .module-row {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 10px 14px;
            border-radius: 14px;
            text-decoration: none;
            color: var(--text-main);
            background: transparent;
            border: 1px solid transparent;
            transition: transform 0.22s cubic-bezier(0.16, 1, 0.3, 1), 
                        background-color 0.2s ease, 
                        border-color 0.2s ease,
                        box-shadow 0.2s ease;
            cursor: pointer;
            outline: none;
            position: relative;
        }

        .module-row:focus-visible {
            box-shadow: 0 0 0 3px var(--row-focus-color, #1e90d6);
        }

        .module-index {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.05em;
            width: 22px;
            flex-shrink: 0;
        }

        .module-icon-tile {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: transform 0.2s ease;
        }

        .module-icon-tile svg {
            width: 24px;
            height: 24px;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
        }

        .module-content-col {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            min-width: 0;
        }

        .module-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .module-mobile-desc {
            display: none;
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.35;
            margin-top: 3px;
        }

        .module-arrow {
            width: 18px;
            height: 18px;
            opacity: 0;
            transform: translateX(-4px);
            transition: opacity 0.2s ease, transform 0.2s ease;
            color: var(--text-main);
            flex-shrink: 0;
        }

        /* Active Row state */
        .module-row.active {
            transform: translateX(4px);
        }

        .module-row.active .module-arrow {
            opacity: 1;
            transform: translateX(0);
        }

        .module-row.active .module-index {
            color: var(--text-main);
        }

        /* Empty search state */
        .no-matches {
            padding: 32px 16px;
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px dashed var(--border-subtle);
            border-radius: 14px;
            margin-top: 8px;
        }

        /* 6. Footer */
        .left-footer {
            margin-top: auto;
            padding-top: 18px;
            border-top: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            font-size: 12px;
            color: var(--text-muted);
            flex-shrink: 0;
        }

        .footer-copyright {
            white-space: nowrap;
        }

        .keyboard-hints {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: var(--text-muted);
            letter-spacing: 0.02em;
            white-space: nowrap;
        }

        .keyboard-hints kbd {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 4px;
            padding: 1px 5px;
            font-family: inherit;
            font-size: 10px;
        }

        /* -------------------------------------- */
        /* RIGHT PANEL                            */
        /* -------------------------------------- */
        .right-panel {
            position: sticky;
            top: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            background: #0a0c16;
            position: relative;
        }

        /* Dual-layer cross-fading glow for 0.5s transition */
        .glow-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
            z-index: 1;
        }

        .glow-layer-a { opacity: 1; }
        .glow-layer-b { opacity: 0; }

        /* Concentric decorative rings */
        .concentric-rings {
            position: absolute;
            right: -240px;
            top: 50%;
            transform: translateY(-50%);
            width: 860px;
            height: 860px;
            pointer-events: none;
            z-index: 2;
        }

        .concentric-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.045);
        }

        .ring-1 { width: 420px; height: 420px; }
        .ring-2 { width: 640px; height: 640px; }
        .ring-3 { width: 860px; height: 860px; }

        /* Preview container */
        .preview-container {
            max-width: 520px;
            width: 100%;
            position: relative;
            z-index: 3;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        /* Re-animation on module change (0.45s fade + 14px slide up) */
        @keyframes previewSlideFade {
            0% {
                opacity: 0;
                transform: translateY(14px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .preview-animate {
            animation: previewSlideFade 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* 116px glass icon tile (34px radius) */
        .preview-glass-tile {
            width: 116px;
            height: 116px;
            border-radius: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 28px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .preview-glass-tile svg {
            width: 56px;
            height: 56px;
            color: #ffffff;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
        }

        /* Counter "03 / 08" */
        .preview-counter {
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.16em;
            margin-bottom: 8px;
            font-variant-numeric: tabular-nums;
        }

        /* Module Name heading clamp 40px to 64px */
        .preview-title {
            font-size: clamp(40px, 4.5vw, 64px);
            font-weight: 800;
            letter-spacing: -0.03em;
            line-height: 1.05;
            color: var(--text-main);
            margin-bottom: 16px;
        }

        /* Module description */
        .preview-desc {
            font-size: 18px;
            line-height: 1.6;
            color: #c7cce6;
            margin-bottom: 32px;
            max-width: 480px;
        }

        /* White "Open module →" button */
        .preview-open-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: #ffffff;
            color: #0a0c16;
            border-radius: 14px;
            padding: 14px 30px;
            font-size: 16px;
            font-weight: 700;
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.25s ease;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
            outline: none;
        }

        .preview-open-btn svg {
            width: 18px;
            height: 18px;
            stroke-width: 2.2;
            transition: transform 0.2s ease;
        }

        .preview-open-btn:hover {
            transform: translateY(-2px);
        }

        .preview-open-btn:hover svg {
            transform: translateX(3px);
        }

        .preview-open-btn:focus-visible {
            box-shadow: 0 0 0 3px #ffffff, 0 0 0 6px rgba(255, 255, 255, 0.3);
        }

        /* -------------------------------------- */
        /* RESPONSIVE (max-width 900px)           */
        /* -------------------------------------- */
        @media (max-width: 900px) {
            .launcher-shell {
                grid-template-columns: 1fr;
            }

            .left-panel {
                padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom)) 20px;
                border-right: none;
                height: auto;
                min-height: 100vh;
            }

            .right-panel {
                display: none !important;
            }

            .module-mobile-desc {
                display: block;
            }

            .module-arrow {
                opacity: 1 !important;
                transform: translateX(0) !important;
            }

            .module-row.active {
                transform: none !important;
            }

            .left-footer {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }
        }

        /* -------------------------------------- */
        /* ACCESSIBILITY: Reduced Motion          */
        /* -------------------------------------- */
        @media (prefers-reduced-motion: reduce) {
            *, ::before, ::after {
                animation-duration: 0.001ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.001ms !important;
            }

            .preview-animate {
                animation: none !important;
            }

            .module-row.active {
                transform: none !important;
            }
        }
    </style>
</head>

<body>
    <!-- Main Launcher Root (Rendered by PortalShell) -->
    <div id="portal-root"></div>

    <!-- Portal Links Configuration (Dynamic Source of Truth) -->
    <script>
        // ==========================================
        // DYNAMIC MODULES CONFIGURATION
        // Any module added/removed here updates the launcher automatically.
        // ==========================================
        const portalLinks = [
            {
                title: "Water Tracker",

                url: "https://www.rguedu.in/water_tracker",

            {

                description: "Manage maintenance requests and track facility operations.",
                url: "https://www.rguedu.in/maintenance/#dashboard",
                color: "#ef4444",
                iconSvg: `<path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>`
            },
            {
                title: "Transport",
                description: "Manage transportation details and track vehicles.",
                url: "https://www.rguedu.in/transport/",
                color: "#37a9f0",
                iconSvg: `<rect x="1" y="3" width="15" height="13" rx="1"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/>`
            },
            {
                title: "NextUp",
                description: "Track enterprise tasks, manage team workflows, and monitor progress.",
                url: "https://www.rguedu.in/nextup",
                color: "#a4c639",
                iconSvg: `<path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/><polyline points="9 13 11 15 15 11"/>`
            },
            {
                title: "AI Bot",
                description: "Interactive AI assistant for campus intelligence, queries, and analytics.",
                url: "https://www.rguedu.in/ai-bot/",
                color: "#9b5de5",
                iconSvg: `<rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4"/><line x1="8" y1="16" x2="8.01" y2="16"/><line x1="16" y1="16" x2="16.01" y2="16"/>`
            },
            {
                title: "Report",
                description: "View operations analytics, monthly summaries, and executive reports.",
                url: "https://www.rguedu.in/report/",
                color: "#f39c2d",
                iconSvg: `<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="8" y2="17"/><line x1="12" y1="11" x2="12" y2="17"/><line x1="16" y1="9" x2="16" y2="17"/>`
            }
        ];

        // ==========================================
        // COMPONENT ARCHITECTURE
        // Split into:
        // - BrandHeader
        // - ModuleSearch
        // - ModuleRow
        // - ModuleList
        // - ModulePreview
        // - PortalShell
        // ==========================================

        /**
         * Component: BrandHeader
         * Renders the colored RGU wordmark, deemed university tag, heading, and subtitle.
         */
        function BrandHeader() {
            return `
                <div class="brand-row">
                    <div class="rgu-wordmark" aria-label="RGU">
                        <span class="char-r">R</span><span class="char-g">G</span><span class="char-u">U</span>
                    </div>
                    <div class="brand-divider" aria-hidden="true"></div>
                    <div class="brand-subtext">
                        <div>DEEMED TO BE</div>
                        <div>UNIVERSITY</div>
                    </div>
                </div>

                <div class="portal-header-group">
                    <h1 class="portal-heading">
                        <span class="gradient-text">Central</span> Portal
                    </h1>
                    <p class="portal-subtitle">
                        Access and manage all tracking systems securely from one centralized dashboard.
                    </p>
                </div>
            `;
        }

        /**
         * Component: ModuleSearch
         * Renders the search input with magnifier icon and shortcut indicator.
         */
        function ModuleSearch({ value }) {
            return `
                <div class="search-container">
                    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input 
                        type="text" 
                        id="module-search-input"
                        class="search-input" 
                        placeholder="Search modules…" 
                        aria-label="Search modules"
                        autocomplete="off"
                        spellcheck="false"
                        value="${value || ''}"
                    />
                    <div class="search-shortcut-hint" aria-hidden="true">/</div>
                </div>
            `;
        }

        /**
         * Component: ModuleRow
         * Renders an individual module link with active state styling.
         */
        function ModuleRow({ module, originalIndex, isActive }) {
            const formattedIndex = String(originalIndex + 1).padStart(2, '0');
            const color = module.color || '#1e90d6';

            // Active styling styles: 12% tint background, 45% border, 3px focus ring
            const activeStyle = isActive 
                ? `background-color: ${color}1f; border-color: ${color}73; --row-focus-color: ${color};`
                : `background-color: transparent; border-color: transparent; --row-focus-color: ${color};`;

            return `
                <a 
                    href="${module.url}" 
                    class="module-row ${isActive ? 'active' : ''}" 
                    data-title="${encodeURIComponent(module.title)}"
                    style="${activeStyle}"
                    role="listitem"
                    tabindex="0"
                >
                    <span class="module-index">${formattedIndex}</span>
                    <div class="module-icon-tile" style="background: ${color}1a; color: ${color}; border: 1px solid ${color}33;">
                        <svg viewBox="0 0 24 24">
                            ${module.iconSvg}
                        </svg>
                    </div>
                    <div class="module-content-col">
                        <span class="module-title">${module.title}</span>
                        <span class="module-mobile-desc">${module.description}</span>
                    </div>
                    <svg class="module-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </a>
            `;
        }

        /**
         * Component: ModuleList
         * Renders the vertical list of filtered modules or the empty search state.
         */
        function ModuleList({ modules, allModules, activeModule }) {
            if (modules.length === 0) {
                return `<div class="no-matches" role="status">No module matches your search.</div>`;
            }

            return `
                <div class="module-list" role="list">
                    ${modules.map(mod => {
                        const originalIndex = allModules.findIndex(m => m.title === mod.title);
                        const isActive = activeModule && activeModule.title === mod.title;
                        return ModuleRow({ module: mod, originalIndex: originalIndex >= 0 ? originalIndex : 0, isActive });
                    }).join('')}
                </div>
            `;
        }

        /**
         * Component: ModulePreview
         * Renders the right panel containing background glow, concentric rings, and animated preview card.
         */
        function ModulePreview({ activeModule, originalIndex, totalCount }) {
            if (!activeModule) {
                return `
                    <div class="concentric-rings" aria-hidden="true">
                        <div class="concentric-ring ring-1"></div>
                        <div class="concentric-ring ring-2"></div>
                        <div class="concentric-ring ring-3"></div>
                    </div>
                `;
            }

            const formattedCounter = `${String(originalIndex + 1).padStart(2, '0')} / ${String(totalCount).padStart(2, '0')}`;
            const color = activeModule.color || '#1e90d6';

            return `
                <div class="concentric-rings" aria-hidden="true">
                    <div class="concentric-ring ring-1"></div>
                    <div class="concentric-ring ring-2"></div>
                    <div class="concentric-ring ring-3"></div>
                </div>

                <div class="preview-container preview-animate" id="preview-card">
                    <!-- Glass icon tile (116px radius 34px) -->
                    <div class="preview-glass-tile" style="background: linear-gradient(135deg, ${color}40 0%, ${color}15 100%); border: 1px solid ${color}70; box-shadow: 0 20px 40px ${color}35, 0 0 0 1px ${color}25;">
                        <svg viewBox="0 0 24 24">
                            ${activeModule.iconSvg}
                        </svg>
                    </div>

                    <!-- Counter -->
                    <div class="preview-counter" style="color: ${color};">
                        ${formattedCounter}
                    </div>

                    <!-- Module heading -->
                    <h2 class="preview-title">
                        ${activeModule.title}
                    </h2>

                    <!-- Module description -->
                    <p class="preview-desc">
                        ${activeModule.description}
                    </p>

                    <!-- Open button -->
                    <a href="${activeModule.url}" class="preview-open-btn" style="--hover-glow: ${color};" onmouseover="this.style.boxShadow='0 12px 28px ${color}66'" onmouseout="this.style.boxShadow='0 4px 14px rgba(0,0,0,0.25)'">
                        <span>Open module</span>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                            <polyline points="12 5 19 12 12 19"></polyline>
                        </svg>
                    </a>
                </div>
            `;
        }

        /**
         * Component: PortalShell
         * Master presentation orchestrator managing local UI state (searchQuery, activeModule).
         */
        function PortalShell({ modules }) {
            // Local state
            let searchQuery = "";
            let activeModule = modules.length > 0 ? modules[0] : null;
            let currentGlowLayer = 'a';

            const root = document.getElementById("portal-root");

            // Compute filtered list
            function getFilteredModules() {
                const q = searchQuery.trim().toLowerCase();
                if (!q) return modules;
                return modules.filter(m => 
                    m.title.toLowerCase().includes(q) || 
                    m.description.toLowerCase().includes(q)
                );
            }

            // Dual-layer smooth 0.5s gradient transition
            function updateGlowGradient(color) {
                const glowA = document.getElementById("glow-layer-a");
                const glowB = document.getElementById("glow-layer-b");
                if (!glowA || !glowB) return;

                const gradientValue = `radial-gradient(circle at 75% 35%, ${color}61 0%, transparent 65%), radial-gradient(circle at 25% 75%, ${color}2e 0%, transparent 55%)`;

                if (currentGlowLayer === 'a') {
                    glowB.style.background = gradientValue;
                    glowB.style.opacity = '1';
                    glowA.style.opacity = '0';
                    currentGlowLayer = 'b';
                } else {
                    glowA.style.background = gradientValue;
                    glowA.style.opacity = '1';
                    glowB.style.opacity = '0';
                    currentGlowLayer = 'a';
                }
            }

            // Re-render UI
            function render() {
                const filtered = getFilteredModules();

                // If active module is not in filtered list, select the first visible
                if (filtered.length > 0 && (!activeModule || !filtered.some(m => m.title === activeModule.title))) {
                    activeModule = filtered[0];
                } else if (filtered.length === 0) {
                    activeModule = null;
                }

                const activeOrigIndex = activeModule ? modules.findIndex(m => m.title === activeModule.title) : 0;

                root.innerHTML = `
                    <div class="launcher-shell">
                        <!-- Left Panel -->
                        <aside class="left-panel">
                            ${BrandHeader()}
                            ${ModuleSearch({ value: searchQuery })}
                            <div id="module-list-container">
                                ${ModuleList({ modules: filtered, allModules: modules, activeModule })}
                            </div>
                            <footer class="left-footer">
                                <span class="footer-copyright">&copy; 2026 RGU Global. All rights reserved.</span>
                                <div class="keyboard-hints" aria-label="Keyboard navigation">
                                    <span><kbd>&uarr;</kbd> <kbd>&darr;</kbd> move</span>
                                    <span>&middot;</span>
                                    <span><kbd>Enter</kbd> open</span>
                                    <span>&middot;</span>
                                    <span><kbd>/</kbd> search</span>
                                </div>
                            </footer>
                        </aside>

                        <!-- Right Panel -->
                        <main class="right-panel" id="right-panel">
                            <div class="glow-layer glow-layer-a" id="glow-layer-a"></div>
                            <div class="glow-layer glow-layer-b" id="glow-layer-b"></div>
                            <div id="preview-slot" style="width: 100%; display: flex; justify-content: center; position: relative; z-index: 3;">
                                ${ModulePreview({ activeModule, originalIndex: activeOrigIndex, totalCount: modules.length })}
                            </div>
                        </main>
                    </div>
                `;

                if (activeModule) {
                    const color = activeModule.color || '#1e90d6';
                    const glowA = document.getElementById("glow-layer-a");
                    if (glowA) {
                        glowA.style.background = `radial-gradient(circle at 75% 35%, ${color}61 0%, transparent 65%), radial-gradient(circle at 25% 75%, ${color}2e 0%, transparent 55%)`;
                    }
                }

                bindEvents();
            }

            // Updates preview card dynamically without destroying input focus
            function updateActivePreview(newActive) {
                if (!newActive) return;
                activeModule = newActive;

                const filtered = getFilteredModules();
                const activeOrigIndex = modules.findIndex(m => m.title === activeModule.title);

                // Update row classes and styles
                const rowEls = document.querySelectorAll(".module-row");
                rowEls.forEach(row => {
                    const rowTitle = decodeURIComponent(row.getAttribute("data-title"));
                    const isNowActive = rowTitle === activeModule.title;
                    const mod = modules.find(m => m.title === rowTitle);
                    const color = mod ? mod.color : '#1e90d6';

                    if (isNowActive) {
                        row.classList.add("active");
                        row.style.backgroundColor = `${color}1f`;
                        row.style.borderColor = `${color}73`;
                    } else {
                        row.classList.remove("active");
                        row.style.backgroundColor = "transparent";
                        row.style.borderColor = "transparent";
                    }
                });

                // Update Preview content in right panel
                const previewSlot = document.getElementById("preview-slot");
                if (previewSlot) {
                    previewSlot.innerHTML = ModulePreview({
                        activeModule,
                        originalIndex: activeOrigIndex,
                        totalCount: modules.length
                    });
                }

                // Smooth glow transition
                updateGlowGradient(activeModule.color || '#1e90d6');
            }

            // Bind listeners
            function bindEvents() {
                const searchInput = document.getElementById("module-search-input");
                if (searchInput) {
                    searchInput.addEventListener("input", (e) => {
                        searchQuery = e.target.value;
                        const filtered = getFilteredModules();
                        if (filtered.length > 0 && (!activeModule || !filtered.some(m => m.title === activeModule.title))) {
                            activeModule = filtered[0];
                        } else if (filtered.length === 0) {
                            activeModule = null;
                        }

                        // Update list and preview only, keeping search input focused
                        const listContainer = document.getElementById("module-list-container");
                        if (listContainer) {
                            listContainer.innerHTML = ModuleList({ modules: filtered, allModules: modules, activeModule });
                            bindRowEvents();
                        }

                        if (activeModule) {
                            updateActivePreview(activeModule);
                        } else {
                            const previewSlot = document.getElementById("preview-slot");
                            if (previewSlot) {
                                previewSlot.innerHTML = ModulePreview({ activeModule: null, originalIndex: 0, totalCount: modules.length });
                            }
                        }
                    });
                }

                bindRowEvents();
            }

            // Bind row mouse and focus events
            function bindRowEvents() {
                const rowEls = document.querySelectorAll(".module-row");
                rowEls.forEach(row => {
                    const title = decodeURIComponent(row.getAttribute("data-title"));
                    const targetMod = modules.find(m => m.title === title);

                    row.addEventListener("mouseenter", () => {
                        if (targetMod && (!activeModule || activeModule.title !== targetMod.title)) {
                            updateActivePreview(targetMod);
                        }
                    });

                    row.addEventListener("focus", () => {
                        if (targetMod && (!activeModule || activeModule.title !== targetMod.title)) {
                            updateActivePreview(targetMod);
                        }
                    });
                });
            }

            // Global keyboard event handler
            window.addEventListener("keydown", (e) => {
                const searchInput = document.getElementById("module-search-input");
                const isInputFocused = document.activeElement === searchInput;

                // "/" shortcut focuses search box
                if (e.key === "/" && !isInputFocused) {
                    e.preventDefault();
                    if (searchInput) {
                        searchInput.focus();
                        searchInput.select();
                    }
                    return;
                }

                // Esc shortcut clears search and unfocuses
                if (e.key === "Escape" && isInputFocused) {
                    searchInput.value = "";
                    searchQuery = "";
                    render();
                    searchInput.blur();
                    return;
                }

                const filtered = getFilteredModules();
                if (filtered.length === 0) return;

                const currentIdx = filtered.findIndex(m => activeModule && m.title === activeModule.title);

                // Arrow Down
                if (e.key === "ArrowDown") {
                    e.preventDefault();
                    const nextIdx = currentIdx < filtered.length - 1 ? currentIdx + 1 : 0;
                    updateActivePreview(filtered[nextIdx]);
                    scrollActiveRowIntoView(filtered[nextIdx].title);
                }

                // Arrow Up
                else if (e.key === "ArrowUp") {
                    e.preventDefault();
                    const prevIdx = currentIdx > 0 ? currentIdx - 1 : filtered.length - 1;
                    updateActivePreview(filtered[prevIdx]);
                    scrollActiveRowIntoView(filtered[prevIdx].title);
                }

                // Enter opens active module
                else if (e.key === "Enter" && !isInputFocused) {
                    if (activeModule && activeModule.url) {
                        e.preventDefault();
                        window.location.href = activeModule.url;
                    }
                }
            });

            function scrollActiveRowIntoView(title) {
                const row = document.querySelector(`.module-row[data-title="${encodeURIComponent(title)}"]`);
                if (row) {
                    row.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
                }
            }

            // Initial render
            render();
        }

        // Initialize when DOM is ready
        document.addEventListener("DOMContentLoaded", () => {
            PortalShell({ modules: portalLinks });
        });
    </script>
</body>
